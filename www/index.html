<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CPMaster Studio</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; font: 16px/1.45 system-ui, Roboto, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 10px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .01em; }
  p { margin: 0; color: #9a9a9a; }
  code { color: #f2f2f2; }
</style>
</head>
<body>
<main>
  <h1>CPMaster Studio</h1>
  <p>Приложение собирается. Эта страница обновится сама.</p>
  <p>Версия: <code id="v">…</code></p>
</main>
<script>
  fetch('version.json', { cache: 'no-store' }).then((r) => r.json()).then((j) => { document.getElementById('v').textContent = j.version; }).catch(() => { document.getElementById('v').textContent = 'локальная'; });
</script>
</body>
</html>
